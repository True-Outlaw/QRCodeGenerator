<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create, customize, and export enterprise-grade QR codes with custom colors, gradients, logos, frames, and high-resolution PNG/SVG vector formats.">
  <meta name="theme-color" content="#0EA5E9">

  <!-- Open Graph / Facebook / LinkedIn / Discord -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://true-outlaw.github.io/QRCodeGenerator/">
  <meta property="og:title" content="Enterprise QR Code Generator">
  <meta property="og:description" content="Create, customize, and export enterprise-grade QR codes with custom colors, gradients, logos, frames, and high-resolution PNG/SVG vector formats.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Enterprise QR Code Generator">
  <meta name="twitter:description" content="Create, customize, and export enterprise-grade QR codes with custom colors, gradients, logos, frames, and high-resolution PNG/SVG vector formats.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QR Generator">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Enterprise QR Code Generator</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
